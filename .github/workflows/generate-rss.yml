name: Rebuild archive data

on:
  push:
    branches: [main]
    paths:
      - "data/posts/**"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aggregate posts into data/posts.json
        run: node aggregate-posts.js

      - name: Generate rss.xml
        run: node build-rss.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json rss.xml
          git diff --staged --quiet || git commit -m "تحديث تلقائي: تجميع المنشورات وتحديث rss.xml"
          git push
